name: Behavioral evals
# Off by default, because evals run real Copilot sessions and spend AI credits.
# Pull requests never start paid runs. The job runs the pinned native
# Vally CLI from package.json. It uses the "evals" environment, so you can require a reviewer to
# approve each run before it gets a token. See docs/ci.md.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Evaluation suite to run
        type: choice
        options: [smoke, full]
        default: smoke
permissions:
  contents: read
jobs:
  evals:
    runs-on: ubuntu-latest
    # Add required reviewers to this environment to approve each run before it starts.
    environment: evals
    timeout-minutes: 30
    permissions:
      contents: read
      copilot-requests: write
    concurrency:
      group: evals-${{ github.workflow_ref }}
      cancel-in-progress: false
    env:
      SUITE: ${{ inputs.suite || 'smoke' }}
      VALLY_TELEMETRY_OPTOUT: '1'
      COPILOT_CLI_PATH: ${{ github.workspace }}/node_modules/@github/copilot/npm-loader.js
      COPILOT_AUTO_UPDATE: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check the runtime bridge
        run: node .github/scripts/eval-runtime.js --version
      # --require-pass fails the job on a failed verdict.
      # The launcher uses one worker and one bounded retry.
      - name: Run evals
        run: npm run eval -- --suite "$SUITE" --require-pass
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Prints the report and adds it to the job summary. It fails on an
      # incomplete run or an infrastructure error.
      - name: Report eval results
        if: ${{ !cancelled() }}
        run: npm run eval:report >> "$GITHUB_STEP_SUMMARY"
      # Results include transcripts, which can contain prompts, model output, and
      # code, so they're uploaded only when EVALS_UPLOAD_RESULTS is true.
      - name: Upload eval results
        if: ${{ !cancelled() && vars.EVALS_UPLOAD_RESULTS == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: eval-results
          path: evals/results/
          retention-days: 7
