name: Compare PR evals
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - plugins/commit-attribution/**
      - evals/commit-attribution/**
      - .github/scripts/commit-attribution-pr*
      - .github/scripts/eval-report*
      - .github/workflows/eval-pr.yml
      - .vally.yaml
      - package.json
      - package-lock.json
  workflow_dispatch:
    inputs:
      pr:
        description: PR number (review its code before approving paid execution)
        type: number
        required: true
      head:
        description: Exact reviewed PR head SHA (40 characters)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: pr-evals-${{ inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: false
env:
  EVAL_MODEL: gpt-6.1-terra
  PR_NUMBER: ${{ inputs.pr || github.event.pull_request.number }}
  EXPECTED_HEAD: ${{ inputs.head || github.event.pull_request.head.sha }}
  VALLY_TELEMETRY_OPTOUT: '1'
jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      authorized: ${{ steps.authorize.outputs.authorized }}
    steps:
      - name: Require trusted main workflow
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Check current contributor or maintainer permissions
        id: authorize
        run: node .github/scripts/commit-attribution-pr.mjs authorize
        env:
          GH_TOKEN: ${{ github.token }}
  compare:
    needs: authorize
    if: ${{ needs.authorize.outputs.authorized == 'true' }}
    runs-on: ubuntu-latest
    environment: evals
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      copilot-requests: write
    outputs:
      base: ${{ steps.prepare.outputs.base }}
      checks_changed: ${{ steps.prepare.outputs.checks_changed }}
      report_ready: ${{ steps.compare.outputs.report_ready }}
    steps:
      - name: Require trusted main workflow
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Capture reviewed skill revisions and identical checks
        id: prepare
        run: node .github/scripts/commit-attribution-pr.mjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Compare baseline and candidate
        id: compare
        run: node .github/scripts/commit-attribution-pr.mjs run
        env:
          COMPARISON_DIR: ${{ steps.prepare.outputs.directory }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save metrics without transcripts
        if: ${{ !cancelled() && steps.compare.outputs.report_ready == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-eval-report
          path: ${{ runner.temp }}/pr-eval-report.json
          if-no-files-found: error
          retention-days: 7
  report:
    needs: compare
    if: ${{ !cancelled() && needs.compare.outputs.report_ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pr-eval-report
          path: ${{ runner.temp }}/pr-eval-report
      - name: Update the PR comparison table
        run: node .github/scripts/commit-attribution-pr.mjs report
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BASE: ${{ needs.compare.outputs.base }}
          CHECKS_CHANGED: ${{ needs.compare.outputs.checks_changed }}
          REPORT_DIR: ${{ runner.temp }}/pr-eval-report
