  - type: tool-calls
    name: recovery-uses-message-file
    config:
      required:
      - name: '(^|[./:_-])(bash|powershell|shell)$'
        command: '\bcommit\b[\s\S]*(?:-F\s+|--file(?:=|\s+))[^\r\n]*message\.txt'
