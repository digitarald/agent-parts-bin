          Object.assign(env, { GIT_CONFIG_GLOBAL: "/dev/null", GIT_CONFIG_NOSYSTEM: "1", GIT_TERMINAL_PROMPT: "0" });
          const options = { cwd: repo, env, encoding: "utf8", stdio: "pipe", timeout: 10000 };
